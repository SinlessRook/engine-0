name: Daily Quiz Notifications

on:
  schedule:
    # 08:00 UTC
    - cron: "0 8 * * *"

    # 20:00 UTC
    - cron: "0 20 * * *"

  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install -r actions/requirements.txt

      - name: Run Daily Quiz Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          RESEND_RECIPIENT_EMAIL: ${{ secrets.RESEND_RECIPIENT_EMAIL }}
          RESEND_SENDER_EMAIL: ${{ secrets.RESEND_SENDER_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          QUIZ_PLATFORM_URL: ${{ secrets.QUIZ_PLATFORM_URL }}

        run: python actions/app.py